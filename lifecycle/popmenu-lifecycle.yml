  scheme: none-observed
  path_version: false
  build_header: popmenu-version
  note: >-
    The only version signal on the wire is a git SHA in the `popmenu-version` response
    header, which changes on every deploy and carries no compatibility meaning.
deprecation:
  policy_published: false
  sunset_header: not-observed
  deprecation_header: not-observed
  rfc8594: false
  note: >-
    No deprecation policy, no Sunset or Deprecation headers observed on any live response,
    and no schema deprecation notice is reachable (the GraphQL schema is auth-gated). No
    `Deprecation` pointer is emitted.
