note: >-
  One real find (a public Atlassian Statuspage with a machine-readable API), and a set of
  honest absences. A `StatusPage` pointer IS emitted in apis.yml because the page exists
  and answers 200. A `Deprecation` pointer is NOT emitted — Popmenu publishes no
  deprecation or versioning policy, and asserting one would be false.
