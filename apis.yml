apis:
- aid: popmenu:rest-api
  name: Popmenu Developer API
  description: >-
    The Popmenu Developer API gives partners access to restaurant data
    including menus, guests, and orders for building custom integrations with
    the Popmenu platform. Popmenu also connects with POS and marketing tools
    such as Square, Toast, Mailchimp, OpenTable, and Yelp. The interface is
    GraphQL, not REST: a single endpoint at https://api.popmenu.com/graphql was
    verified live on 2026-08-13 (HTTP 200, application/json) and is mirrored at
    https://my.popmenu.com/graphql. Introspection and every query return an
    `unauthorized` error envelope without partner credentials, so the schema
    cannot be discovered publicly. There is no OpenAPI, Swagger, AsyncAPI or
    published reference, no documented authentication scheme, and no
    self-service signup — get.popmenu.com/developer-api is a lead-capture form
    that lands on a "we'll be reaching out to you soon" page.
