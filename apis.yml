apis:
- aid: popmenu:rest-api
  name: Popmenu Developer API
  description: >-
    The Popmenu Developer API gives partners access to restaurant data
    including menus, guests, and orders for building custom integrations with
    the Popmenu platform. Popmenu also connects with POS and marketing tools
    such as Square, Toast, Mailchimp, OpenTable, and Yelp. Detailed public
    reference, authentication, and base URL are not openly documented; access
    is arranged via Popmenu's developer and partner channels. There is no
    publicly downloadable OpenAPI or API reference at this time.
  humanURL: https://get.popmenu.com/developer-api
