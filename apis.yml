      Mobile-responsive restaurant websites with built-in SEO designed to
      convert visitors into guests.
  - name: Interactive Dynamic Menus
    description: >-
      Photo-rich, followable menu items with guest engagement, reviews, and
      AI-driven menu recommendations.
  - name: Online Ordering
    description: >-
      First-party online ordering for pickup, delivery, and dine-in that
      keeps margins with the restaurant rather than third-party marketplaces.
  - name: Marketing Automation
    description: >-
      Automated email and SMS marketing, social posting, and reputation
      management driven by guest profile data.
  - name: Menu Management
    description: >-
      Centralized menu management and publishing that syncs across the
      website, ordering, and partner channels such as OpenTable.
