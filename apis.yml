aid: popmenu
name: Popmenu
description: >-
  Popmenu is a restaurant technology platform offering websites, interactive and
  dynamic menus, online ordering, marketing automation, and menu management
  designed to turn a restaurant's web presence into a customer conversion
  engine. Popmenu promotes a Developer API that gives partners access to data on
  menus, guests, orders, and more for custom integrations, and it connects to
  applications such as Square, Toast, Google Analytics, Mailchimp, OpenTable,
  Resy, DoorDash, and Yelp, plus hundreds of others through partner
  integrations. That API is GraphQL rather than REST: a live single endpoint was
  verified at https://api.popmenu.com/graphql on 2026-08-13, mirrored at
  https://my.popmenu.com/graphql, returning HTTP 200 with vendor
  popmenu-ratelimit-* headers — but introspection and every query answer
  "unauthorized" without partner credentials, so the schema cannot be discovered
  publicly. No OpenAPI, Swagger, AsyncAPI, webhook catalog, MCP server, agent
  card, llms.txt or /.well-known/ document exists on any Popmenu host.
  Authentication, scopes, error codes and rate limits are undocumented, and
  get.popmenu.com/developer-api is a lead-capture form rather than a reference.
  Popmenu's engineering stack is Ruby on Rails with a React front end, and its
  entire marketing estate returns HTTP 403 to non-browser clients.
type: Index
accessModel:
  pricing: paid
  onboarding: approval
  trial: false
  try_now: false
  public: false
  label: Paid · Requires approval
