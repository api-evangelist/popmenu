aid: popmenu
name: Popmenu
description: >-
  Popmenu is a restaurant technology platform offering websites, interactive and
  dynamic menus, online ordering, marketing automation, and menu management
  designed to turn a restaurant's web presence into a customer conversion
  engine. Popmenu promotes a Developer API that gives partners access to data on
  menus, guests, orders, and more for custom integrations, and it connects to
  applications such as Square, Toast, Google Analytics, Mailchimp, and Yelp,
  plus hundreds of others through Zapier. Public technical documentation,
  authentication details, and base URLs are not openly published; API access is
  arranged through Popmenu's developer and support channels rather than
  self-service onboarding.
