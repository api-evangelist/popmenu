  - https://api.popmenu.com/graphql
  generated: '2026-08-13'
  method: searched
  note: >-
    HAND-CORRECTED, do not let derive-access-model.py overwrite this without a fix
    upstream. On 2026-08-13 that script derived `onboarding: open / public: true /
    "Open access"` for Popmenu, which is the opposite of the truth. The cause is its
    `auth_present and not types -> open` branch: this repo's
    authentication/popmenu-authentication.yml exists but declares `schemes: []`
    BECAUSE Popmenu documents no authentication at all, and the script read that
    honest empty set as evidence of anonymous access. The real posture: the Developer
    API is reachable only after a sales conversation
    (get.popmenu.com/developer-api is a lead-capture form landing on /success-api),
    every unauthenticated call to https://api.popmenu.com/graphql returns
    `unauthorized`, and the published $159/$269/$449-per-month tiers price the
    software platform, not API access.
