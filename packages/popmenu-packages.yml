note: >-
  IMPORTANT DISTINCTION — these are first-party but they are NOT API client SDKs.
  Popmenu publishes an active @popmenu npm scope, but every package in it is a React /
  React Native component or device-bridge library built for Popmenu's OWN web and mobile
  apps (Online Ordering, MyPop admin, the Owners app, receipt printers). None of them
  wraps the Popmenu Developer API, and Popmenu publishes no client library for that API in
  any language. For that reason this artifact carries a `Packages` pointer in apis.yml but
  deliberately does NOT carry an `SDKs` pointer — crediting Popmenu with API SDKs it does
  not ship would be false. Registries with no @popmenu / popmenu first-party presence:
  PyPI (404), RubyGems (no first-party gem), Maven Central, NuGet, pkg.go.dev,
  Packagist, crates.io.
